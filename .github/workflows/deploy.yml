
name: Build and Deploy Inhabi

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-page
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, SEO and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build:s

      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy dist to page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: page
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
