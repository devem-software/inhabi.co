<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <!-- 1. Accesibilidad y Viewport (Google penaliza bloquear el zoom) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 2. Theme Color (Tiñe la barra superior del navegador en móviles) -->
  <meta name="theme-color" content="#1B1A16">

  <!-- 3. Metadatos de respaldo (Para páginas 404 o rastreadores básicos) -->
  <title>Inhabi — Arquitectura e interiorismo</title>
  <meta name="description" content="Diseñamos y ejecutamos proyectos de arquitectura, interiorismo y remodelación integral en Bogotá.">
  <meta name="author" content="Inhabi">

  <!-- 4. Open Graph de respaldo genérico -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Inhabi">
  <meta property="og:title" content="Inhabi — Arquitectura e interiorismo">

  <!-- 5. Iconos -->
  <link rel="icon" href="/favicon.ico">

  <!-- 6. Preconexión óptima para Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
